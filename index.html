<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amit Kumar - Profile</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: Arial, sans-serif;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
    }

    .profile {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 1.5rem;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.12);
      max-width: 430px;
      padding: 2rem;
      text-align: center;
      width: 100%;
    }

    .profile-image {
      border: 5px solid #dbeafe;
      border-radius: 50%;
      height: 150px;
      object-fit: cover;
      width: 150px;
    }

    h1 {
      font-size: 2rem;
      margin: 1rem 0 0.25rem;
    }

    .title {
      color: #2563eb;
      font-size: 1rem;
      margin-bottom: 1rem;
    }

    .profile-links {
      display: flex;
      gap: 0.6rem;
      margin-top: 1.25rem;
    }

    .profile-button {
      align-items: center;
      background: #2563eb;
      border-radius: 999px;
      color: #ffffff;
      display: flex;
      gap: 0.55rem;
      justify-content: center;
      padding: 0.45rem 0.75rem;
      text-decoration: none;
      font-size: 0.78rem;
      flex: 1;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .profile-button:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }

    .contact {
      border-top: 1px solid #e2e8f0;
      display: grid;
      gap: 0.8rem;
      padding-top: 1.25rem;
    }

    .contact a {
      align-items: center;
      color: #334155;
      display: flex;
      gap: 0.65rem;
      justify-content: center;
      text-decoration: none;
    }

    .contact span {
      align-items: center;
      display: flex;
      gap: 0.65rem;
      justify-content: center;
    }

    .contact i {
      color: #2563eb;
      width: 1.1rem;
    }

    .contact a:hover {
      color: #2563eb;
    }

    @media (max-width: 480px) {
      .profile-links {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <main class="profile">
    <img class="profile-image" src="user-1.jpeg" alt="Amit Kumar profile photo">
    <h1>Amit Kumar</h1>
    <p class="title">Web Designer & Frontend Specialist</p>

    <div class="contact">
      <a href="tel:+916280299226"><i class="fas fa-phone"></i> +91 628-029-9226</a>
      <a href="mailto:amitkumarparjapat1432@gmail.com"><i class="fas fa-envelope"></i>
        amitkumarparjapat1432@gmail.com</a>
      <span><i class="fas fa-map-marker-alt"></i> India</span>
      <a href="https://www.linkedin.com/in/amit-kumar-b8722422a/" target="_blank" rel="noopener"><i
          class="fab fa-linkedin"></i> LinkedIn Profile</a>
    </div>

    <div class="profile-links" aria-label="Profile links">
      <a class="profile-button" href="amit-job.html" target="_blank" rel="noopener">
        <i class="fas fa-laptop-code"></i> Web Designer Profile
      </a>
      <a class="profile-button" href="amit-work.html" target="_blank" rel="noopener">
        <i class="fas fa-briefcase"></i> Multi-role Profile
      </a>
    </div>
  </main>
</body>

</html>
